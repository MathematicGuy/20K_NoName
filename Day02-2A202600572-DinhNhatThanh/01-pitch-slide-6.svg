<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1"/>

  <!-- Top bar gradient accent -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accent)"/>

  <!-- Footer -->
  <line x1="40" y1="410" x2="760" y2="410" stroke="#334155" stroke-width="1"/>
  <text x="40" y="428" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PITCH DECK | SOẠN MCQ RE-ACT AI</text>
  <text x="400" y="428" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ĐINH NHẬT THANH - 2A202600572</text>
  <text x="760" y="428" text-anchor="end" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">SLIDE 6/7</text>

  <!-- Slide Title -->
  <text x="40" y="50" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">BÁO CÁO PHÂN TÍCH</text>
  <text x="40" y="80" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">🛡️ RANH GIỚI BẢO MẬT &amp; PHƯƠNG ÁN DỰ PHÒNG</text>
  <line x1="40" y1="92" x2="150" y2="92" stroke="#06D6A0" stroke-width="2"/>

  <!-- Content -->
  
  <!-- Left Box: Safety Gate -->
  <rect x="40" y="120" width="340" height="250" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="155" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">🛡️ RANH GIỚI BẢO MẬT &amp; AN TOÀN</text>
  
  <text x="60" y="195" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Human-in-the-Loop (HITL):</text>
  <text x="60" y="213" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Giảng viên sở hữu hoàn toàn quyết định cuối cùng.</text>
  <text x="60" y="230" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">AI không bao giờ tự động đẩy đề lên LMS.</text>

  <text x="60" y="270" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Chống ảo tưởng (Hallucinations):</text>
  <text x="60" y="288" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Dữ liệu nguồn được ghim chặt chẽ vào Slide bài giảng,</text>
  <text x="60" y="305" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">tuyệt đối không bịa đặt kiến thức ngoài lề.</text>

  <!-- Right Box: Fallback Mechanism -->
  <rect x="420" y="120" width="340" height="250" rx="10" fill="#F59E0B" fill-opacity="0.05" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" filter="url(#shadow)"/>
  <text x="440" y="155" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">⚠️ PHƯƠNG ÁN DỰ PHÒNG (FALLBACK)</text>
  
  <text x="440" y="195" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Khi có lỗi phát sinh hoặc AI bịa tin:</text>
  
  <text x="440" y="230" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">➔ Dừng chatbot &amp; Kích hoạt template Word</text>
  <text x="440" y="255" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Hệ thống có sẵn template Excel/Word được thiết lập sẵn</text>
  <text x="440" y="272" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">để giảng viên điền tay, đảm bảo tiến độ kỳ thi</text>
  <text x="440" y="289" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">không bị gián đoạn dù hệ thống AI có sự cố.</text>

</svg>
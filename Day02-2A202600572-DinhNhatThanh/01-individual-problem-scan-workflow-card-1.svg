<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="1000" height="540" fill="#F8FAFC"/>

  <!-- Main Title -->
  <g transform="translate(0, 0)">
    <text x="500" y="38" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">QUY TRÌNH SOẠN ĐỀ MCQ: THỦ CÔNG VS. VÒNG LẶP RE-ACT AI</text>
    <text x="500" y="58" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Giảng viên và AI cộng tác thảo luận, tinh chỉnh câu hỏi liên tục đến khi hài lòng</text>
  </g>

  <!-- ================= LEFT COLUMN: CURRENT STATE (MANUAL) ================= -->
  <g id="current-state" transform="translate(45, 80)">
    <!-- Boundary Card -->
    <rect width="420" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="25" y="32" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">TRẠNG THÁI HIỆN TẠI (THỦ CÔNG)</text>
    <text x="25" y="52" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">120 Phút / Bộ 20 Câu</text>
    
    <!-- Steps -->
    <!-- Step 1 -->
    <g transform="translate(25, 75)">
      <rect width="370" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">1. Đọc slide bài giảng &amp; giáo trình (20')</text>
    </g>
    <line x1="210" y1="113" x2="210" y2="129" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(25, 130)">
      <rect width="370" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">2. Xác định các khái niệm kiểm tra (15')</text>
    </g>
    <line x1="210" y1="168" x2="210" y2="184" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(25, 185)">
      <rect width="370" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">3. Viết câu hỏi &amp; đáp án đúng (25')</text>
    </g>
    <line x1="210" y1="223" x2="210" y2="239" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 4 (Bottleneck) -->
    <g transform="translate(25, 240)">
      <rect width="370" height="42" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="15" y="25" fill="#991B1B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4. Sáng tạo 3 đáp án nhiễu (40') 🚨 BOTTLENECK</text>
    </g>
    <line x1="210" y1="282" x2="210" y2="299" stroke="#EF4444" stroke-width="1.2" marker-end="url(#arrow-red)"/>

    <!-- Step 5 (Format Bottleneck) -->
    <g transform="translate(25, 300)">
      <rect width="370" height="42" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.2"/>
      <text x="15" y="25" fill="#9A3412" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">5. Định dạng chuẩn Aiken/GIFT (15') ⚠️ DỄ LỖI</text>
    </g>
    <line x1="210" y1="342" x2="210" y2="359" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 6 -->
    <g transform="translate(25, 360)">
      <rect width="370" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">6. Upload file lên LMS &amp; test đề (5')</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: FUTURE STATE (RE-ACT COLLABORATIVE) ================= -->
  <g id="future-state" transform="translate(535, 80)">
    <!-- Boundary Card -->
    <rect width="420" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="25" y="32" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">TRẠNG THÁI TƯƠNG LAI (RE-ACT COLLABORATION)</text>
    <text x="25" y="52" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">25 Phút / Đạt 100% Thỏa Mãn</text>
    
    <!-- Steps -->
    <!-- Step 1 -->
    <g transform="translate(25, 75)">
      <rect width="330" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">1. Upload slide lên hệ thống (1')</text>
    </g>
    <line x1="190" y1="113" x2="190" y2="129" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 2: AI Draft -->
    <g transform="translate(25, 130)">
      <rect width="330" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <text x="15" y="24" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. AI trích khái niệm &amp; Soạn nháp MCQ (2')</text>
    </g>

    <!-- Downward Arrow (AI sends draft to Lecturer) -->
    <line x1="150" y1="168" x2="150" y2="219" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
    <text x="140" y="198" text-anchor="end" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Gửi nháp</text>

    <!-- Step 3: Lecturer review / Re-Act Loop -->
    <g transform="translate(25, 220)">
      <rect width="330" height="42" rx="6" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5"/>
      <text x="15" y="25" fill="#075985" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3. Giảng viên đánh giá &amp; Góp ý (15') 👤 HITL</text>
    </g>

    <!-- Curved Upward Arrow (Re-Act Loop: Feedback goes back to AI) -->
    <!-- Curves out to x=385, from y=241 (Step 3) to y=149 (Step 2) -->
    <path d="M 355,241 C 390,241 390,149 355,149" fill="none" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <!-- Loop Label -->
    <rect x="358" y="184" width="55" height="18" rx="4" fill="#0EA5E9" />
    <text x="385" y="196" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">RE-ACT</text>
    <text x="385" y="212" text-anchor="middle" fill="#0284C7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Thảo luận</text>

    <!-- Downward Exit Arrow (Once satisfied, proceed to Step 4) -->
    <line x1="190" y1="262" x2="190" y2="299" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="196" y="285" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Khi hài lòng ➔</text>

    <!-- Step 4: Rule format -->
    <g transform="translate(25, 300)">
      <rect width="330" height="38" rx="6" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="15" y="24" fill="#78350F" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4. Auto-convert Aiken/GIFT bằng code (1')</text>
    </g>
    <line x1="190" y1="338" x2="190" y2="354" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <g transform="translate(25, 355)">
      <rect width="330" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="24" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">5. Download file sạch &amp; Import lên LMS (3')</text>
    </g>

    <!-- Fallback Box inside Right Column at the bottom -->
    <g transform="translate(25, 403)">
      <rect width="370" height="5" rx="2.5" fill="#CBD5E1" />
    </g>
  </g>
</svg>

    <text x="0" y="70" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Dùng prompt chuẩn</text>
    <text x="0" y="86" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">với 3 Giảng Viên</text>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(350, 210)">

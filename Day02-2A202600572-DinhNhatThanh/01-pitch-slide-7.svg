  <!-- Call to Action Text -->
  <text x="400" y="345" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">👉 HÀNH ĐỘNG NGAY: KIẾN NGHỊ BẮT ĐẦU GIAI ĐOẠN PILOT TUẦN TỚI</text>

</svg>